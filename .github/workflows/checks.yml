name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Omarchy is Arch, and so is this: the same Qt the plugin runs on, new
    # enough for QtQuick.Effects (Card.qml's MultiEffect) and for qmllint's
    # per-category configuration in .qmllint.ini. Ubuntu's Qt 6.4 has
    # neither.
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      # qt6-declarative carries qmllint, qmltestrunner and every QML module
      # the tests import, QtTest and QtQuick.Effects included. The rest is
      # what the scripts and tests run: bash and coreutils (env, timeout,
      # head, tee, install), util-linux for setpriv and su, python, node and
      # curl. Most of these are in the image already; naming them keeps the
      # list honest. git is installed before the checkout so it is a real
      # clone rather than an unpacked archive, although nothing below needs
      # it.
      #
      # --disable-sandbox: inside a container, pacman's downloader sandbox
      # can be refused the Landlock and setuid calls it makes, which fails
      # every download. Packages are still verified against their
      # signatures, and the container is thrown away afterwards.
      - name: Install Qt 6 and the tools the checks run
        run: |
          pacman -Syu --noconfirm --needed --disable-sandbox \
            qt6-declarative \
            bash coreutils util-linux \
            python nodejs curl git

      - uses: actions/checkout@v4

      # The container runs as root, and the plugin never does: the file
      # checks in Helper.js depend on who owns what. The checks run as an
      # ordinary user that owns a copy of the checkout and makes its scratch
      # directory under its own home, as on a desktop.
      - name: Make a test user
        run: |
          useradd --create-home tester
          cp -a "$GITHUB_WORKSPACE" /home/tester/plugin
          chown -R tester:tester /home/tester/plugin

      - name: Lint
        run: su tester -c 'cd /home/tester/plugin && scripts/lint'

      - name: Test
        run: su tester -c 'cd /home/tester/plugin && scripts/test'
