# cava config template for the Voxscope spectrum. Hud.qml fills in the input
# source with the default PipeWire source (the microphone) and writes the result to
# $XDG_RUNTIME_DIR/voxscope/cava.conf before launching cava. Gain is fixed;
# Hud.qml normalises levels itself (spectrum.js), because autosens starts
# with every band clipped. At sensitivity 100 speech into a laptop
# microphone peaked at about 70 of the 1000 steps, so the gain is tripled
# to use more of the range; the loudest speech may still touch the top.
[general]
bars = 32
framerate = 60
autosens = 0
sensitivity = 300
lower_cutoff_freq = 80
higher_cutoff_freq = 8000

[input]
method = pipewire
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 0.35
