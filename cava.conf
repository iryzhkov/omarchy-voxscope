# cava config template for the Voxscope spectrum. Hud.qml fills in the input
# source with the default PipeWire source (the microphone) and writes the result to
# $XDG_RUNTIME_DIR/voxscope/cava.conf before launching cava. Gain is fixed;
# Hud.qml normalises levels itself (spectrum.js), because autosens starts
# with every band clipped. Measured on a MacBook Air microphone: at
# sensitivity 300 normal speech peaked at about 40 of the 1000 steps and
# soft speech at about 10, so soft speech rounded to 0-4 and was gated out.
# At 3000 normal speech peaks around 250-700 and soft speech 60-390, and
# cava's whole-number output keeps enough resolution in every band.
[general]
bars = 32
framerate = 60
autosens = 0
sensitivity = 3000
lower_cutoff_freq = 80
higher_cutoff_freq = 8000

[input]
method = pipewire
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 0.35
