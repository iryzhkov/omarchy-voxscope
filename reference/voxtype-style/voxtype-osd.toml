name = "signal"
version = "0.2.0"
description = "Themed HUD dictation OSD: live mic spectrum from cava while recording, a cell-built decode scan while speech is transcribed, a rotating ring while the LLM post-processes, words typed out as blocks at the end, and a pipeline stepper (REC, STT, LLM, OUT) with progress throughout."
compatibility = "voxtype quickshell style packages"
palette = "omarchy"
layout = "custom"
qml_entry = "Signal.qml"

# Signal.qml derives its colours from the active Omarchy theme. These only
# matter if the custom QML fails to load and voxtype falls back to its
# built-in renderer.
[frame]
background = "background"
border = "accent"
glow = true
halo = false

[[visual.layers]]
type = "bars"
source = "peak"
color = "accent"
order = 10
