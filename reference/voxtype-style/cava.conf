# cava config for the signal OSD spectrum. Signal.qml substitutes
# @SOURCE@ with the default PipeWire source (the mic) before launching cava.
# Gain is fixed; Signal.qml normalises levels itself, because autosens starts
# with every band clipped.
[general]
bars = 32
framerate = 60
autosens = 0
sensitivity = 100
lower_cutoff_freq = 80
higher_cutoff_freq = 8000

[input]
method = pipewire
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 0.35
